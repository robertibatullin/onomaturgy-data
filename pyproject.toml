[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onomaturgy-data"
version = "0.2.0"
description = "CSV corpus data for the onomaturgy name generator"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["onomaturgy_data*"]

[tool.setuptools.package-data]
onomaturgy_data = ["csv/**/*.csv"]
